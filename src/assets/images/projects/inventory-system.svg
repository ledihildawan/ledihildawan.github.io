<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="50%" stop-color="#121418" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  
  <!-- Ambient glow spheres -->
  <circle cx="520" cy="80" r="140" fill="#D97706" opacity="0.25" filter="url(#glow)" />
  <circle cx="120" cy="280" r="120" fill="#F59E0B" opacity="0.18" filter="url(#glow)" />

  <!-- Grid lines pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="300" x2="640" y2="300" />
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
  </g>

  <!-- Browser Window Mockup Frame -->
  <g transform="translate(48, 36)">
    <!-- Window Container -->
    <rect width="544" height="288" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2" />
    
    <!-- Window Title Bar -->
    <path d="M0 12C0 5.37 5.37 0 12 0H532C538.63 0 544 5.37 544 12V38H0V12Z" fill="#ffffff" fill-opacity="0.04" />
    <line x1="0" y1="38" x2="544" y2="38" stroke="#ffffff" stroke-opacity="0.08" />
    
    <!-- Window Traffic Lights -->
    <circle cx="20" cy="19" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="36" cy="19" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="52" cy="19" r="4.5" fill="#10B981" opacity="0.8" />

    <!-- Window Search/URL Bar -->
    <rect x="76" y="9" width="220" height="20" rx="6" fill="#ffffff" fill-opacity="0.06" />
    <text x="88" y="23" fill="#ffffff" fill-opacity="0.45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500">https://app.internal/inventory-system</text>

    <!-- App Content Area Layout -->
    <!-- Sidebar -->
    <rect x="16" y="52" width="110" height="220" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05" />
    <rect x="26" y="66" width="90" height="10" rx="4" fill="#D97706" fill-opacity="0.8" />
    <rect x="26" y="86" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.2" />
    <rect x="26" y="100" width="80" height="6" rx="3" fill="#ffffff" fill-opacity="0.12" />
    <rect x="26" y="114" width="60" height="6" rx="3" fill="#ffffff" fill-opacity="0.12" />
    <rect x="26" y="128" width="75" height="6" rx="3" fill="#ffffff" fill-opacity="0.12" />
    <rect x="26" y="142" width="65" height="6" rx="3" fill="#ffffff" fill-opacity="0.12" />

    <!-- Main Workspace -->
    <!-- Metric cards row -->
    <rect x="138" y="52" width="120" height="56" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06" />
    <rect x="150" y="64" width="40" height="6" rx="3" fill="#ffffff" fill-opacity="0.3" />
    <rect x="150" y="76" width="65" height="14" rx="4" fill="url(#accentGrad)" />

    <rect x="268" y="52" width="120" height="56" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06" />
    <rect x="280" y="64" width="40" height="6" rx="3" fill="#ffffff" fill-opacity="0.3" />
    <rect x="280" y="76" width="55" height="14" rx="4" fill="#ffffff" fill-opacity="0.6" />

    <rect x="398" y="52" width="130" height="56" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06" />
    <rect x="410" y="64" width="50" height="6" rx="3" fill="#ffffff" fill-opacity="0.3" />
    <rect x="410" y="76" width="75" height="14" rx="4" fill="#F59E0B" fill-opacity="0.8" />

    <!-- Big Center Dashboard Area -->
    <rect x="138" y="120" width="390" height="152" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06" />
    
    <!-- Central Project Badge/Banner -->
    <g transform="translate(154, 136)">
      <!-- Category Tag Pill -->
      <rect x="0" y="0" width="130" height="20" rx="10" fill="url(#accentGrad)" fill-opacity="0.2" stroke="#D97706" stroke-opacity="0.6" />
      <text x="12" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="0.5">STOCK & WAREHOUSE ERP</text>
      
      <!-- Project Title -->
      <text x="0" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Sistem Manajemen Inventori</text>
      <text x="0" y="62" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Software Engineering &amp; Architecture Showcase</text>
      
      <!-- UI Wireframe bars in main area -->
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="170" height="8" rx="4" fill="#ffffff" fill-opacity="0.15" />
        <rect x="0" y="14" width="130" height="8" rx="4" fill="#ffffff" fill-opacity="0.09" />
        <rect x="0" y="28" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.06" />
        
        <rect x="200" y="0" width="150" height="36" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="212" y="22" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">✓ Production Verified</text>
      </g>
    </g>
  </g>
</svg>
