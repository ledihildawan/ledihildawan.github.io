<form action="https://formspree.io/f/xbjqbkzg" method="POST">
  <div class="p pb-3">
    <strong>Punya ide menarik atau mau bikin proyek bareng? Kirim pesan di sini ya!</strong>
  </div>
  <!-- honeypot anti-spam:jangan diisi manusia -->
  <input
    type="text"
    name="_gotcha"
    tabindex="-1"
    autocomplete="off"
    aria-hidden="true"
    style="position: absolute; left: -9999px; top: -9999px; opacity: 0; height: 0; width: 0"
  />
  <div class="row mb-3">
    <div class="col">
      <div class="input-group">
        <span class="input-group-addon">
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            focusable="false"
            class="svg-form"
          >
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
        </span>
        <input
          class="form-control"
          type="email"
          name="_replyto"
          placeholder="nama@domain.com"
          required="required"
        />
        <small class="form-error"></small>
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col">
      <div class="form-group">
        <textarea
          class="form-control cc-contact-textarea"
          name="message"
          placeholder="Ceritakan ide proyek atau hal yang ingin kamu diskusikan..."
          required="required"
          rows="3"
          data-auto-resize
        ></textarea>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <button class="btn btn-primary" type="submit">Kirim Pesan</button>
    </div>
  </div>
</form>
