<form action="https://formspree.io/f/xbjqbkzg" method="POST">
  <div class="p pb-3">
    <strong>Punya ide proyek atau butuh tangan ekstra? Kabari saya ya!</strong>
  </div>
  <!-- honeypot anti-spam:jangan diisi manusia -->
  <input
    type="text"
    name="_gotcha"
    tabindex="-1"
    autocomplete="off"
    aria-hidden="true"
    style="position: absolute; left: -9999px; top: -9999px; opacity: 0; height: 0; width: 0"
  />
  <div class="row mb-3">
    <div class="col">
      <div class="input-group">
        <span class="input-group-addon">
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="currentColor"
            focusable="false"
            class="svg-form"
          >
            <path
              d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
            />
          </svg>
        </span>
        <input
          class="form-control"
          type="email"
          name="_replyto"
          placeholder="Email kamu"
          required="required"
        />
        <small class="form-error"></small>
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col">
      <div class="form-group">
        <textarea
          class="form-control"
          placeholder="Ceritain proyek yang mau kamu bangun..."
          required="required"
        ></textarea>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <button class="btn btn-primary" type="submit">Kirim Pesan</button>
    </div>
  </div>
</form>
