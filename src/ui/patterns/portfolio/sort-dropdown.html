<div class="sort-dropdown" data-sort-dropdown>
  <button
    class="sort-trigger"
    type="button"
    aria-haspopup="listbox"
    aria-expanded="false"
    aria-label="Urutkan karya"
  >
    <span class="sort-value" data-sort-label>Karya Terbaru</span>
    <svg
      class="sort-chevron"
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="currentColor"
      focusable="false"
    >
      <path d="M7 10l5 5 5-5z" />
    </svg>
  </button>
  <ul class="sort-menu" role="listbox" aria-label="Opsi pengurutan" hidden>
    <li
      class="sort-option is-selected"
      role="option"
      aria-selected="true"
      data-value="recent"
      tabindex="-1"
    >
      Karya Terbaru
    </li>
    <li class="sort-option" role="option" aria-selected="false" data-value="popular" tabindex="-1">
      Paling Populer
    </li>
  </ul>
</div>
