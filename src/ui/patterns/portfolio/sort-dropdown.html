<div class="sort-dropdown" data-sort-dropdown>
  <button
    class="sort-trigger"
    type="button"
    aria-haspopup="listbox"
    aria-expanded="false"
    aria-label="Urutkan karya"
  >
    <svg
      class="sort-icon"
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="currentColor"
      focusable="false"
    >
      <path
        d="M3 6h18v2H3V6zm0 5h12v2H3v-2zm0 5h6v2H3v-2zM17 8.59V11h-2v2h2v2.41L19.41 13 17 8.59zM18.41 7l3.59 3.59V15l-4 4h-2v-6h2V7.41L19.41 9 18.41 7z"
      />
    </svg>
    <span class="sort-value" data-sort-label>Recent shots</span>
    <svg
      class="sort-chevron"
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="currentColor"
      focusable="false"
    >
      <path d="M7 10l5 5 5-5z" />
    </svg>
  </button>
  <ul class="sort-menu" role="listbox" aria-label="Opsi pengurutan" hidden>
    <li
      class="sort-option is-selected"
      role="option"
      aria-selected="true"
      data-value="recent"
      tabindex="-1"
    >
      Recent shots
    </li>
    <li class="sort-option" role="option" aria-selected="false" data-value="popular" tabindex="-1">
      Popular shots
    </li>
  </ul>
</div>
