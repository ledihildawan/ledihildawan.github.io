<div class="section" id="portfolio">
  <div class="container">
    <div class="row">
      <div class="col-md-6 ml-auto mr-auto">
        <h2 class="h4 text-center mb-4 title">Karya &amp; Eksplorasi</h2>
      </div>
    </div>
    <div class="portfolio-toolbar">
      <div
        class="nav nav-pills nav-pills-primary filter-chips"
        role="group"
        aria-label="Filter kategori karya"
      >
        <button
          class="nav-item nav-link filter-chip active"
          data-filter="web"
          aria-pressed="true"
          type="button"
        >
          Web Development
        </button>
        <button
          class="nav-item nav-link filter-chip"
          data-filter="design"
          aria-pressed="false"
          type="button"
        >
          Desain Grafis
        </button>
        <button
          class="nav-item nav-link filter-chip"
          data-filter="photo"
          aria-pressed="false"
          type="button"
        >
          Fotografi
        </button>
      </div>
      <%- include('patterns/portfolio/sort-dropdown.html') %>
    </div>
    <div class="gallery mt-4"><%- include('patterns/portfolio/portfolio-items.html') %></div>
    <div class="portfolio-load-more-wrap" id="portfolio-load-more-wrap" hidden>
      <button
        type="button"
        class="btn btn-primary btn-round portfolio-load-more-btn"
        id="portfolio-load-more-btn"
      >
        Muat Lebih Banyak
      </button>
    </div>
  </div>
</div>
