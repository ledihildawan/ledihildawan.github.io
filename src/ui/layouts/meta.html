<script>
  // Set tema sebelum CSS dievaluasi - cegah FOUC dan mencegah fetch
  // background light di dark mode (sebaliknya). Rule background di CSS
  // sudah di-scope html:not(.dark-mode) / html.dark-mode, jadi begitu
  // class terpasang di sini, browser hanya fetch background tema aktif.
  // Sinkron dengan primitives/theme-toggle.js (key 'lh-theme').
  (function () {
    try {
      var t = localStorage.getItem('lh-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (t === 'dark') document.documentElement.classList.add('dark-mode');
    } catch (e) {}
  })();
</script>
